<!doctype html>
<!-- generated by kon -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{name}} — start</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #c9d5e1 url("file://{{wallpaper}}") center / cover fixed;
    color: #1b2633;
    font: 13px "Open Sans", "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  /* win7 style window */
  .win {
    width: min(600px, calc(100vw - 32px));
    padding: 0 7px 7px;
    border: 1px solid rgba(0, 0, 0, .55);
    border-radius: 7px;
    background: linear-gradient(rgba(205, 225, 245, .94), rgba(143, 178, 216, .9));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6), 0 8px 30px rgba(0, 0, 0, .45);
  }
  .title { height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px 0 6px; }
  .title span { text-shadow: 0 0 10px #fff, 0 0 4px #fff; }
  .caps { display: flex; }
  .caps i {
    width: 26px; height: 18px; border: 1px solid rgba(0, 0, 0, .5); border-left-width: 0;
    background: linear-gradient(#e6eef6 0 50%, #c2d2e2 50%);
  }
  .caps i:first-child { border-left-width: 1px; border-radius: 0 0 0 4px; }
  .caps i:last-child { width: 42px; border-radius: 0 0 4px 0; background: linear-gradient(#e8a493 0 50%, #c7452c 50%); }
  .body { background: #fbfcfd; border: 1px solid rgba(60, 80, 100, .7); border-radius: 2px; padding: 22px 24px 16px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; }
  .clock { font-size: 54px; font-weight: 300; line-height: 1; color: #1e395b; }
  .date { text-align: right; color: #1e395b; font-size: 15px; }
  .date small { display: block; color: #6d7f91; font-size: 12px; }
  .hello { margin: 12px 0 16px; color: #4b5d70; }
  form { display: flex; gap: 6px; }
  input {
    flex: 1; min-width: 0; height: 30px; padding: 0 8px;
    font: inherit; font-size: 14px; color: #1b1b1b;
    border: 1px solid #8e9aa6; border-radius: 2px; outline: none;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .08);
  }
  input:focus { border-color: #3d7bad; }
  button {
    height: 30px; padding: 0 18px; font: inherit; color: #1b1b1b; cursor: pointer;
    border: 1px solid #707070; border-radius: 3px;
    background: linear-gradient(#f2f2f2 0 45%, #dddddd 50%, #cfcfcf);
  }
  button:hover { border-color: #3c7fb1; background: linear-gradient(#eaf6fd 0 45%, #bee6fd 50%, #a7d9f5); }
  .links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 16px; }
  .links a {
    display: block; padding: 8px 6px; text-decoration: none; color: #1e3287;
    border: 1px solid transparent; border-radius: 3px;
  }
  .links a:hover { border-color: #7da2ce; background: linear-gradient(#eaf3fc, #c5dcf5); }
  .links a span { display: block; color: #6d7f91; font-size: 11px; }
  .status { margin-top: 14px; padding-top: 8px; border-top: 1px solid #d5dfe5; color: #6d7f91; font-size: 11px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="win">
  <div class="title"><span>{{name}} — start</span><div class="caps"><i></i><i></i><i></i></div></div>
  <div class="body">
    <div class="top">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">&nbsp;<small>{{tagline}}</small></div>
    </div>
    <p class="hello" id="hello">Welcome back.</p>
    <form id="search">
      <input id="q" name="q" autocomplete="off" autofocus placeholder="Search the web, or g: for Google">
      <button>Search</button>
    </form>
    <nav class="links">
      <a href="https://claude.ai">Claude<span>chat</span></a>
      <a href="https://github.com">GitHub<span>code</span></a>
      <a href="https://reddit.com/r/MoeDesktop">Reddit<span>r/MoeDesktop</span></a>
      <a href="https://youtube.com">YouTube<span>music</span></a>
    </nav>
    <div class="status"><span id="greet"></span><span>Internet | Protected Mode: On</span></div>
  </div>
</div>
<script>
  function tick() {
    const d = new Date();
    document.getElementById("clock").textContent =
      d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    document.getElementById("date").firstChild.textContent =
      d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 5000);
  const h = new Date().getHours();
  document.getElementById("greet").textContent =
    h < 5 ? "Still up?" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  document.getElementById("search").addEventListener("submit", (e) => {
    e.preventDefault();
    let q = document.getElementById("q").value.trim();
    if (!q) return;
    if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q)) { location.href = "https://" + q; return; }
    const google = q.startsWith("g:");
    if (google) q = q.slice(2).trim();
    location.href = (google ? "https://google.com/search?q=" : "https://duckduckgo.com/?q=") + encodeURIComponent(q);
  });
</script>
</body>
</html>
